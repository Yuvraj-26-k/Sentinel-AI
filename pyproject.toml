[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "1.0.0"
description = "Cross-platform, local-first network security monitoring for the terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "SQLAlchemy>=2.0,<3",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
sentinel = "sentinel:main"

[tool.setuptools]
py-modules = ["analyst", "detection", "sentinel", "telemetry"]
