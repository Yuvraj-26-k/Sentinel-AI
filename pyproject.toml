[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "1.1.0"
description = "Cross-platform TCP port scanning, optional AI explanations, and network monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "SQLAlchemy>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "google-auth>=2.29,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
sentinel = "sentinel:main"
sentinel-scan = "scanner:main"

[tool.setuptools]
py-modules = ["analyst", "detection", "sentinel", "telemetry", "scanner"]
